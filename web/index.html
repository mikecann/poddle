    <meta property="og:site_name" content="Poddle">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://poddle.mikecann.app/">

  <body>
    <div id="root"><!--poddle:landing--><!--/poddle:landing--></div>
    <script>
      // The build prerenders the home page into #root (vite.config.ts). Every other
      // page is served from this file too, so clear it there before it's drawn.
      if (location.pathname !== "/") document.getElementById("root").replaceChildren();
    </script>
    <script type="module" src="/src/main.tsx"></script>
