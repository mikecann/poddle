name: Poddle nightly E2E report
on:
  push:
    branches: [e2e-nightly]
permissions:
  contents: read
  issues: write
concurrency:
  group: e2e-nightly-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('results/latest.json', 'utf8'));
            const { owner, repo } = context.repo;
            const label = 'e2e-failure';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'd73a4a', description: 'Poddle nightly end-to-end failure' });
            }
            const issues = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            })).filter(issue => !issue.pull_request);
            const source = `https://github.com/${owner}/${repo}/commit/${report.sha}`;
            if (report.status === 'passed') {
              for (const issue of issues) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `Nightly E2E passed for [${report.sha.slice(0, 8)}](${source}) (${report.finishedAt}). Closing this.` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
              return;
            }
            const failures = report.scenarios.filter(s => s.status === 'failed');
            const screenshotRoot = `https://github.com/${owner}/${repo}/blob/${context.sha}/`;
            const lines = [
              `Nightly E2E failed for [${report.sha}](${source}).`,
              `Finished: ${report.finishedAt}`, '',
              ...failures.map(s => `- **${s.suite}**: ${s.name}`),
              ...(report.error ? ['', `Setup/build: ${report.error}`] : []),
              ...(!failures.length ? ['', 'The run did not complete. Check the tinker-desk nightly logs.'] : []),
              '', ...((report.screenshots ?? []).map(file => `- [${file}](${screenshotRoot}${file.split('/').map(encodeURIComponent).join('/')})`)),
              ...(report.omittedScreenshots ? [`${report.omittedScreenshots} screenshot(s) omitted to keep the report small.`] : []),
            ];
            const body = lines.join('\n');
            const title = `Nightly E2E failed (${report.sha.slice(0, 8)})`;
            if (issues.length) {
              await github.rest.issues.update({ owner, repo, issue_number: issues[0].number, title, body });
              for (const duplicate of issues.slice(1)) {
                await github.rest.issues.createComment({ owner, repo, issue_number: duplicate.number,
                  body: `Tracking this in #${issues[0].number}.` });
                await github.rest.issues.update({ owner, repo, issue_number: duplicate.number, state: 'closed' });
              }
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }
